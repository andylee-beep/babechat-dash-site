var LANG=(localStorage.getItem('charLang')==='ko')?'ko':'zh';
function t(k){var v=T[k];return v?(LANG==='ko'?v[1]:v[0]):k}
function CO(){return LANG==='ko'?': ':'：'}   // 冒號
function CM(){return LANG==='ko'?', ':'，'}   // 逗號
function tf(k){var s=t(k),a=arguments;for(var i=1;i<a.length;i++)s=s.replace('%s',a[i]);return s}

function nf(n){return Math.round(n||0).toLocaleString()}
function esc(s){return (s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function pct(a,b){return b? (a/b*100).toFixed(1)+'%' : '—'}
function shift(iso,d){var t=new Date(iso+'T00:00:00Z');t.setUTCDate(t.getUTCDate()+d);return t.toISOString().slice(0,10)}
function $(id){return document.getElementById(id)}
function natT(v){return v==='韓國'?t('kr'):t('tw')}      // 資料值固定中文，顯示才翻譯

var qbActive='all';
function setRange(a,b,tag){ $('d1').value=a||''; $('d2').value=b||''; qbActive=tag||'';
  document.querySelectorAll('button.qb').forEach(function(x){x.classList.toggle('on',x.dataset.q===qbActive)}); draw(); }
function dateField(){ return $('dfield').value==='pub' ? I.pub : I.cre }
function dfLabel(){ return $('dfield').value==='pub' ? t('f_pub') : t('f_cre') }

function filtered(){
  var d1=$('d1').value, d2=$('d2').value, df=dateField();
  var fn=$('fnat').value, fa=$('fadu').value, fv=$('fvis').value, q=$('q').value.trim().toLowerCase();
  return D.filter(function(x){
    var dt=x[df]||'';
    if(d1||d2){ if(!dt) return false; if(d1&&dt<d1) return false; if(d2&&dt>d2) return false; }
    if(fn&&x[I.nat]!==fn) return false;
    if(fa&&(fa==='adult'?x[I.adu]!==1:x[I.adu]!==0)) return false;
    if(fv&&x[I.vis]!==fv) return false;
    if(q&&((x[I.name]||'').toLowerCase().indexOf(q)<0 && (x[I.author]||'').toLowerCase().indexOf(q)<0)) return false;
    return true;
  });
}
function sum(rows,i){var s=0;for(var k=0;k<rows.length;k++)s+=rows[k][i]||0;return s}

/* ── 核心指標 ── */
function renderKPI(rows){
  var kr=rows.filter(function(x){return x[I.nat]==='韓國'}), tw=rows.length-kr.length;
  var adu=rows.filter(function(x){return x[I.adu]===1}).length;
  var pub=rows.filter(function(x){return x[I.vis]==='public'}).length;
  var rev=sum(rows,I.rev), chat=sum(rows,I.chat);
  var earn=rows.filter(function(x){return x[I.rev]>0}).length;
  var au={}; rows.forEach(function(x){au[x[I.aid]]=1});
  var k=[
    [nf(rows.length),t('k_n'), rows.length!==D.length?(t('k_all')+' '+nf(D.length)):''],
    [nf(adu),t('k_adult'),t('k_sfw')+' '+nf(rows.length-adu)],
    [nf(pub),t('k_pub'), pct(pub,rows.length)],
    [nf(kr.length),t('k_kr'),t('tw')+' '+nf(tw)],
    [nf(chat),t('k_chat'), rows.length?(t('k_avg')+' '+nf(chat/rows.length)):''],
    ['NT$'+nf(rev),t('k_rev'), rows.length?(t('k_avg')+' NT$'+nf(rev/rows.length)):''],
    [pct(earn,rows.length),t('k_earn'), tf('k_earn_sub',nf(earn),nf(rows.length))],
    [nf(Object.keys(au).length),t('k_authors'),'']
  ];
  $('kpis').innerHTML=k.map(function(x){
    return '<div class="kpi"><div class="v">'+x[0]+'</div><div class="l">'+x[1]+'</div>'+(x[2]?'<div class="s">'+x[2]+'</div>':'')+'</div>';
  }).join('');
}

/* ── 韓台 × 成人 2×2 交叉 ── */
function cell(rows){
  var n=rows.length, rev=sum(rows,I.rev), chat=sum(rows,I.chat);
  var e=rows.filter(function(x){return x[I.rev]>0}).length;
  return {n:n,rev:rev,chat:chat,revPer:n?rev/n:0,chatPer:n?chat/n:0,earn:n?e/n*100:0};
}
function groups(rows){
  var g=[
    {k:t('c_kr_a'), c:'var(--kr)', rows:rows.filter(function(x){return x[I.nat]==='韓國'&&x[I.adu]===1})},
    {k:t('c_kr_s'), c:'#f9a8d4', rows:rows.filter(function(x){return x[I.nat]==='韓國'&&x[I.adu]===0})},
    {k:t('c_tw_a'), c:'var(--tw)', rows:rows.filter(function(x){return x[I.nat]==='台灣'&&x[I.adu]===1})},
    {k:t('c_tw_s'), c:'#93c5fd', rows:rows.filter(function(x){return x[I.nat]==='台灣'&&x[I.adu]===0})}
  ];
  g.forEach(function(x){x.m=cell(x.rows)});
  return g;
}
function renderCross(rows){
  var g=groups(rows), tot=sum(rows,I.rev);
  var kr=cell(rows.filter(function(x){return x[I.nat]==='韓國'})), tw=cell(rows.filter(function(x){return x[I.nat]==='台灣'}));
  var ad=cell(rows.filter(function(x){return x[I.adu]===1})), sf=cell(rows.filter(function(x){return x[I.adu]===0}));
  var cols=[{k:g[0].k,m:g[0].m},{k:g[1].k,m:g[1].m},{k:g[2].k,m:g[2].m},{k:g[3].k,m:g[3].m},
            {k:t('c_sub_kr'),m:kr,grp:1},{k:t('c_sub_tw'),m:tw,grp:1},
            {k:t('c_sub_a'),m:ad,grp:1},{k:t('c_sub_s'),m:sf,grp:1}];
  var specs=[[t('r_n'),function(m){return nf(m.n)}],
             [t('r_rev'),function(m){return nf(m.rev)}],
             [t('r_share'),function(m){return pct(m.rev,tot)}],
             [t('r_revper'),function(m){return nf(m.revPer)}],
             [t('r_chat'),function(m){return nf(m.chat)}],
             [t('r_chatper'),function(m){return nf(m.chatPer)}],
             [t('r_earn'),function(m){return m.n?m.earn.toFixed(1)+'%':'—'}]];
  var h='<table class="cross"><tr><th></th>'+cols.map(function(c){return '<th class="r'+(c.grp?' grp':'')+'">'+c.k+'</th>'}).join('')+'</tr>';
  specs.forEach(function(s){
    h+='<tr><td class="rl">'+s[0]+'</td>'+cols.map(function(c){return '<td'+(c.grp?' class="grp"':'')+'>'+s[1](c.m)+'</td>'}).join('')+'</tr>';
  });
  $('cross').innerHTML=h+'</table>';
  renderCharts(rows,g,tot);
}

/* ── 圖表（純 SVG/CSS，隨篩選更新）── */
function barsH(items,fmt){
  var mx=Math.max.apply(null,items.map(function(x){return x.v}).concat([1]));
  return items.map(function(x){
    var w=Math.max(x.v/mx*100,x.v>0?1.5:0);
    return '<div style="margin-bottom:9px">'
      +'<div style="display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:3px">'
      +'<span style="color:#9aa1b1">'+x.k+'</span><span style="font-weight:700">'+fmt(x.v)+'</span></div>'
      +'<div style="height:9px;background:#12151d;border-radius:5px;overflow:hidden">'
      +'<div style="height:100%;width:'+w+'%;background:'+x.c+';border-radius:5px"></div></div></div>';
  }).join('');
}
function renderCharts(rows,g,tot){
  var c1='<div class="chart"><h3>'+t('ch1')+'</h3><div class="sub">'+t('ch1s')+'</div>'
    +barsH(g.map(function(x){return {k:x.k,v:x.m.rev,c:x.c}}),function(v){return 'NT$'+nf(v)+'（'+pct(v,tot)+'）'})+'</div>';
  var c2='<div class="chart"><h3>'+t('ch2')+'</h3><div class="sub">'+t('ch2s')+'</div>'
    +barsH(g.map(function(x){return {k:x.k,v:x.m.revPer,c:x.c}}),function(v){return 'NT$'+nf(v)})+'</div>';
  var c3='<div class="chart"><h3>'+t('ch3')+'</h3><div class="sub">'+t('ch3s')+'</div>'
    +g.map(function(x){
      var np=rows.length? x.m.n/rows.length*100:0, rp=tot? x.m.rev/tot*100:0;
      return '<div style="margin-bottom:11px"><div style="font-size:11.5px;color:#9aa1b1;margin-bottom:3px">'+x.k+'</div>'
      +'<div style="display:flex;align-items:center;gap:6px;margin-bottom:3px"><span style="font-size:10px;color:#6b7280;width:32px">'+t('ch3n')+'</span>'
      +'<div style="flex:1;height:8px;background:#12151d;border-radius:4px;overflow:hidden"><div style="height:100%;width:'+np+'%;background:#4b5563;border-radius:4px"></div></div>'
      +'<span style="font-size:10.5px;width:44px;text-align:right">'+np.toFixed(1)+'%</span></div>'
      +'<div style="display:flex;align-items:center;gap:6px"><span style="font-size:10px;color:#6b7280;width:32px">'+t('ch3r')+'</span>'
      +'<div style="flex:1;height:8px;background:#12151d;border-radius:4px;overflow:hidden"><div style="height:100%;width:'+rp+'%;background:'+x.c+';border-radius:4px"></div></div>'
      +'<span style="font-size:10.5px;width:44px;text-align:right">'+rp.toFixed(1)+'%</span></div></div>';
    }).join('')+'</div>';
  var df=dateField(), mo={};
  rows.forEach(function(x){var d=x[df]; if(d) mo[d.slice(0,7)]=(mo[d.slice(0,7)]||0)+1});
  var ks=Object.keys(mo).sort(), mx=Math.max.apply(null,ks.map(function(k){return mo[k]}).concat([1]));
  var c4='<div class="chart"><h3>'+t('ch4')+'</h3><div class="sub">'+tf('ch4s',dfLabel(),ks.length)+'</div>'
    +'<div style="display:flex;align-items:flex-end;gap:3px;height:120px">'
    +ks.map(function(k){var hh=mo[k]/mx*100;
      return '<div title="'+k+'：'+mo[k]+'" style="flex:1;min-width:6px;display:flex;flex-direction:column;justify-content:flex-end;height:100%">'
        +'<div style="height:'+hh+'%;background:linear-gradient(180deg,#a855f7,#6d28d9);border-radius:3px 3px 0 0;min-height:2px"></div></div>';
    }).join('')+'</div>'
    +'<div style="display:flex;justify-content:space-between;font-size:10px;color:#6b7280;margin-top:5px">'
    +'<span>'+(ks[0]||'')+'</span><span>'+tf('ch4peak',mx)+'</span><span>'+(ks[ks.length-1]||'')+'</span></div></div>';
  $('charts').innerHTML=c1+c2+c3+c4;
}

/* ── 角色明細 ── */
function renderChars(rows){
  var s=+$('csort').value, lim=+$('clim').value;
  var r=rows.slice();
  r.sort(function(a,b){
    if(s===I.cre||s===I.pub) return (b[s]||'').localeCompare(a[s]||'');
    if(s===99){ var ax=a[I.users]?a[I.rev]/a[I.users]:0, bx=b[I.users]?b[I.rev]/b[I.users]:0; return bx-ax; }
    return (b[s]||0)-(a[s]||0);
  });
  $('ccnt').textContent=tf('cnt_match',nf(r.length))+CM()+((lim&&r.length>lim)?tf('cnt_top',lim):t('cnt_all'));
  var show=lim? r.slice(0,lim):r, h='';
  for(var i=0;i<show.length;i++){var x=show[i];
    h+='<tr><td>'+(i+1)+'</td><td>'+esc(x[I.name])+'</td><td>'+esc(x[I.author])+'</td>'
      +'<td style="color:'+(x[I.nat]==='韓國'?'var(--kr)':'var(--tw)')+'">'+natT(x[I.nat])+'</td>'
      +'<td>'+(x[I.adu]?t('adult'):t('sfw'))+'</td><td>'+x[I.vis]+'</td>'
      +'<td class="r">'+nf(x[I.chat])+'</td><td class="r">'+nf(x[I.users])+'</td><td class="r">'+nf(x[I.likes])+'</td>'
      +'<td class="r hl">'+nf(x[I.rev])+'</td>'
      +'<td class="r">'+(x[I.users]?nf(x[I.rev]/x[I.users]):'—')+'</td>'
      +'<td>'+(x[I.cre]||'')+'</td>'
      +'<td'+(x[I.pub]?'':' style="color:#6b7280"')+'>'+(x[I.pub]||'—')+'</td>'
      +'<td>'+(x[I.cat]||'')+'</td><td>'+esc((x[I.tag]||'').slice(0,36))+'</td></tr>';}
  $('ctb').innerHTML=h;
}

/* ── 創作者明細 ── */
function renderAuthors(rows){
  var m={};
  rows.forEach(function(x){
    var a=m[x[I.aid]]||(m[x[I.aid]]={name:x[I.author],aid:x[I.aid],nat:x[I.nat],n:0,adu:0,chat:0,users:0,rev:0,first:'9999',last:'0000'});
    a.n++; a.chat+=x[I.chat]||0; a.users+=x[I.users]||0; a.rev+=x[I.rev]||0; if(x[I.adu])a.adu++;
    var d=x[I.cre]||''; if(d&&d<a.first)a.first=d; if(d&&d>a.last)a.last=d;
  });
  var list=Object.keys(m).map(function(k){var a=m[k];
    a.revPer=a.n?a.rev/a.n:0; a.arppu=a.users?a.rev/a.users:0;
    if(a.first==='9999')a.first=''; if(a.last==='0000')a.last='';
    return a;});
  var s=$('asort').value, lim=+$('alim').value;
  list.sort(function(x,y){
    if(s==='first'||s==='last') return (y[s]||'').localeCompare(x[s]||'');
    return (y[s]||0)-(x[s]||0);});
  var tot=list.reduce(function(a,b){return a+b.rev},0);
  var top10=list.slice(0,10).reduce(function(a,b){return a+b.rev},0);
  $('acnt').textContent=tf('a_cnt_match',nf(list.length))+CM()+((lim&&list.length>lim)?tf('cnt_top',lim):t('cnt_all'));
  $('aconc').innerHTML=tf('aconc',pct(top10,tot));
  var show=lim? list.slice(0,lim):list, h='';
  for(var i=0;i<show.length;i++){var a=show[i];
    h+='<tr><td>'+(i+1)+'</td><td>'+esc(a.name||'—')+'</td><td style="color:#6b7280;font-size:11.5px">'+esc(a.aid)+'</td>'
      +'<td style="color:'+(a.nat==='韓國'?'var(--kr)':'var(--tw)')+'">'+natT(a.nat)+'</td>'
      +'<td class="r">'+nf(a.n)+'</td><td class="r">'+nf(a.adu)+'</td>'
      +'<td class="r">'+nf(a.chat)+'</td><td class="r">'+nf(a.users)+'</td>'
      +'<td class="r hl">'+nf(a.rev)+'</td><td class="r">'+nf(a.revPer)+'</td>'
      +'<td class="r">'+(a.users?nf(a.arppu):'—')+'</td>'
      +'<td>'+(a.first||'')+'</td><td>'+(a.last||'')+'</td></tr>';}
  $('atb').innerHTML=h;
}

function draw(){
  var rows=filtered();
  var d1=$('d1').value, d2=$('d2').value;
  $('rangelbl').textContent=(d1||d2)? tf('range_x', d1||t('earliest'), d2||t('newest'), dfLabel())
                                    : tf('range_all', dfLabel());
  var ex=($('dfield').value==='pub' && (d1||d2))? NOPUB : 0;
  $('excl').innerHTML = ex? tf('excl',nf(ex)) : '';
  renderKPI(rows); renderCross(rows); renderChars(rows); renderAuthors(rows);
}

function quick(tag){
  if(tag==='all') return setRange('','', 'all');
  if(tag==='y')   return setRange(DMAX, DMAX, 'y');
  if(tag==='p')   return setRange(shift(DMAX,-1), shift(DMAX,-1), 'p');
  if(tag==='7')   return setRange(shift(DMAX,-6), DMAX, '7');
  if(tag==='30')  return setRange(shift(DMAX,-29), DMAX, '30');
  if(tag==='m')   return setRange(DMAX.slice(0,7)+'-01', DMAX, 'm');
}

  $('asofLbl').textContent=t('asof')+' '+ASOF;
  $('infoBox').innerHTML=t('info')+'<br>'+tf('base_dmax',DMAX,ASOF)+' —— '
    +(META.lag>0? tf('lag_yes',META.lag) : t('lag_no'));
  $('qy').textContent=t('q_latest')+' '+DMAX.slice(5);
  $('qp').textContent=t('q_prev')+' '+shift(DMAX,-1).slice(5);
  $('hintChars').textContent=tf('hint_chars',nf(NLIVE));
  $('noteDates').innerHTML=tf('note_dates',nf(NLIVE),nf(NOPUB));
  $('noteNat').innerHTML=t('note_nat')+t('note_rev');
  var w=$('warnNat'); if(w) w.innerHTML=tf('warn_nat',w.dataset.n);
  document.querySelectorAll('.langseg button').forEach(function(b){b.classList.toggle('on',b.dataset.l===LANG)});
  draw();
}
document.querySelectorAll('.langseg button').forEach(function(b){
  b.onclick=function(){ LANG=b.dataset.l; localStorage.setItem('charLang',LANG); applyLang(); };});

['q','fnat','fadu','fvis','dfield','d1','d2'].forEach(function(id){
  $(id).addEventListener(id==='q'?'input':'change',function(){
    if(id==='d1'||id==='d2'){qbActive='';document.querySelectorAll('button.qb').forEach(function(x){x.classList.remove('on')});}
    draw();});});
['csort','clim'].forEach(function(id){$(id).addEventListener('change',function(){renderChars(filtered())})});
['asort','alim'].forEach(function(id){$(id).addEventListener('change',function(){renderAuthors(filtered())})});
document.querySelectorAll('button.qb').forEach(function(b){b.onclick=function(){quick(b.dataset.q)}});
setRange('','', 'all');
applyLang();
</script>
