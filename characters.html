<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/png" href="favicon.png"><title>BabeChat 台灣角色大盤</title><script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script><style>
:root{--bg:#0f1117;--card:#171a23;--line:#262a36;--tx:#e8eaf0;--dim:#9aa1b1;--hl:#c084fc;
--kr:#f472b6;--tw:#60a5fa;--grad:linear-gradient(90deg,#a855f7,#ec4899)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Pretendard","Noto Sans TC","Noto Sans KR",sans-serif;font-size:14px}
.wrap{max-width:1480px;margin:0 auto;padding:22px 18px 60px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
h1{font-size:25px;margin:0 0 4px;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:800}
.langseg{display:flex;gap:3px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;flex:0 0 auto}
.langseg button{border:0;background:transparent;color:var(--dim);font-weight:800;font-size:12.5px;padding:6px 13px;border-radius:8px;cursor:pointer;font-family:inherit}
.langseg button.on{background:var(--grad);color:#fff}
.srcbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:9px 0 18px;font-size:12px;color:var(--dim)}
.badge{background:#2a1e3d;color:#d8b4fe;border:1px solid #4c1d95;padding:3px 10px;border-radius:99px;font-weight:700}
.sec{display:flex;align-items:center;gap:10px;margin:28px 0 11px;flex-wrap:wrap}
.sec h2{font-size:16px;margin:0;font-weight:700}
.sec .hint{font-size:11.5px;color:#6b7280}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px}
.kpi .v{font-size:21px;font-weight:800;color:var(--hl)}
.kpi .l{font-size:12px;color:var(--dim);margin-top:3px}
.kpi .s{font-size:11px;color:#6b7280;margin-top:2px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:#1d2130;font-size:12px;color:var(--dim);font-weight:700;position:sticky;top:0;z-index:2}
td.r,th.r{text-align:right} td.c,th.c{text-align:center} td.rl{color:var(--dim)} td.hl{color:var(--hl);font-weight:700}
tr:hover td{background:#1c2030}
.cross td:not(.rl){text-align:right;font-variant-numeric:tabular-nums}
.cross .grp{background:#1a1f2e;font-weight:700}
.note{font-size:11.5px;color:#6b7280;margin-top:8px;line-height:1.65}
.warn{background:#3b1d1d;border:1px solid #7f1d1d;color:#fca5a5;padding:10px 12px;border-radius:10px;font-size:12.5px;margin:12px 0;line-height:1.6}
.info{background:#152238;border:1px solid #1e3a5f;color:#93c5fd;padding:10px 12px;border-radius:10px;font-size:12.5px;margin:12px 0;line-height:1.6}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.ctl .lbl{font-size:12px;color:var(--dim);margin-right:-3px}
input,select,button.qb{background:#12151d;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;font-family:inherit}
input[type=date]{color-scheme:dark}
input.q{min-width:190px}
button.qb{cursor:pointer;font-weight:700}
button.qb:hover{border-color:var(--hl);color:var(--hl)}
button.qb.on{background:var(--grad);border-color:transparent;color:#fff}
.tblwrap{max-height:620px;overflow:auto;border-radius:10px}
.cnt{font-size:12px;color:var(--dim)}
code{background:#12151d;padding:1px 5px;border-radius:4px;font-size:12px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px;margin-top:12px}
.chart{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.chartw{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:12px}
.chartw h3{margin:0 0 4px;font-size:14.5px;font-weight:700;color:var(--tx)}
.chartw .sub{font-size:12.5px;color:#6b7280;margin:0 0 10px}
.chartbox{position:relative;height:270px}
.chart h3{margin:0 0 10px;font-size:13px;font-weight:700;color:var(--tx)}
.chart .sub{font-size:11px;color:#6b7280;margin:-6px 0 10px}

/* ── 三頁共用字級標尺（ui_type.py）────────────────────────── */
h2,.sh h2{font-size:20px}   /* Overview(v2) 的區塊標題是 .sh h2，權重比裸 h2 高 */
table th{font-size:13px}
table td{font-size:15px}
/* Marketing：.cl 標籤／.cv 數字／.cu 副值／.cs 說明 */
.cl{font-size:14px} .cv{font-size:28px} .cu{font-size:14px} .cs{font-size:13.5px}
/* Overview(v2)：.lab 標籤／.val 數字／.sub 說明／.by 次要／.foot 頁尾 */
.kpi .lab{font-size:14px} .kpi .val{font-size:28px} .kpi .sub{font-size:13.5px}
.by{font-size:13.5px} .foot{font-size:12px} .ttl{font-size:14.5px}
/* Character：.kpi .v 數字／.kpi .l 標籤／.kpi .s 說明／.sec .hint 提示 */
.kpi .v{font-size:28px} .kpi .l{font-size:14px} .kpi .s{font-size:12.5px}
.sec h2{font-size:20px} .sec .hint{font-size:12.5px} .srcbar{font-size:13.5px}
.chart h3{font-size:14.5px} .chart .sub{font-size:12.5px} .cnt{font-size:13.5px}
/* Character 的表單控制項一併放大，不然跟旁邊的字不搭 */
.ctl .lbl{font-size:13.5px} .ctl input,.ctl select,.ctl button.qb{font-size:14px}
/* 註腳下限：不要再有 12px 以下的字
   （.rk 排名圓圈／.pct 長條內百分比／.r 圖表單位 是固定尺寸元件，維持原樣避免撐破外框）*/
.note,.cap,.hint,small,.pill{font-size:12px}

/* ── 核心指標：一行四張、共兩行（Andy 指定）────────────────── */
/* #kpi_core 是 Overview(v2) 的 8 張卡；.kpis 是 Character 的 8 張卡 */
@media(min-width:1000px){
  #kpi_core.kgrid{grid-template-columns:repeat(4,1fr)}
  .kpis{grid-template-columns:repeat(4,1fr)}
}

    [nf(adu),t('k_adult'),t('k_sfw')+' '+nf(rows.length-adu)],
    [nf(pub),t('k_pub'), pct(pub,rows.length)],
    [nf(kr.length),t('k_kr'),t('tw')+' '+nf(tw)],
    [nf(chat), isPeriod()?t('k_chat_p'):t('k_chat'), rows.length?(t('k_avg')+' '+nf(chat/rows.length)):''],
    ['NT$'+nf(rev), isPeriod()?t('k_rev_p'):t('k_rev'), rows.length?(t('k_avg')+' NT$'+nf(rev/rows.length)):''],
    [pct(earn,rows.length),t('k_earn'), tf('k_earn_sub',nf(earn),nf(rows.length))],
    [nf(Object.keys(au).length),t('k_authors'),'']
  ];
  $('kpis').innerHTML=k.map(function(x){

             [t('r_revper'),function(m){return nf(m.revPer)}],

  renderCharts(rows,g,tot);

/* ── 圖表（純 SVG/CSS，隨篩選更新）── */
function barsH(items,fmt){
  var mx=Math.max.apply(null,items.map(function(x){return x.v}).concat([1]));
  return items.map(function(x){
    var w=Math.max(x.v/mx*100,x.v>0?1.5:0);
    return '<div style="margin-bottom:9px">'
      +'<div style="display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:3px">'
      +'<span style="color:#9aa1b1">'+x.k+'</span><span style="font-weight:700">'+fmt(x.v)+'</span></div>'
      +'<div style="height:9px;background:#12151d;border-radius:5px;overflow:hidden">'
      +'<div style="height:100%;width:'+w+'%;background:'+x.c+';border-radius:5px"></div></div></div>';
  }).join('');
}

var _CH2=[];

/* 累加成累計序列 */
function runSum(a){ var s=0; return a.map(function(v){ s+=v; return s; }); }
function drawLine(id, labels, a, b, ca, cb, na, nb, fa, fb, dual){
  var el=document.getElementById(id); if(!el||!window.Chart) return;
  var prev=Chart.getChart(el); if(prev) prev.destroy();
  var grid='rgba(255,255,255,.05)', tick='#9aa1b1';
  var ds=[{label:na,data:a,borderColor:ca,backgroundColor:ca.replace('rgb','rgba').replace(')',',.10)'),
           tension:.3,fill:true,pointRadius:2,pointHoverRadius:5,borderWidth:2},
          {label:nb,data:b,borderColor:cb,borderDash:[5,4],tension:.3,fill:false,
           pointRadius:2,pointHoverRadius:5,borderWidth:2}];
  if(dual) ds[1].yAxisID='y1';
  var sc={x:{ticks:{color:tick,maxRotation:45,autoSkip:true,maxTicksLimit:18},grid:{color:grid}},
          y:{position:'left',ticks:{color:tick,callback:function(v){return fa(v);}},grid:{color:grid}}};
  if(dual) sc.y1={position:'right',ticks:{color:cb,callback:function(v){return fb(v);}},grid:{drawOnChartArea:false}};
  _CH2.push(new Chart(el,{type:'line',data:{labels:labels,datasets:ds},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      plugins:{legend:{labels:{color:tick,boxWidth:14,font:{size:12.5}}},
        tooltip:{callbacks:{label:function(c){
          return c.dataset.label+'：'+(c.datasetIndex===0?fa(c.raw):fb(c.raw)); }}}},
      scales:sc}}));
}

/* 每日：篩選後角色的對話量與歸戶營收（營收＝當日全站營收 × 該群當日點數佔比） */
function dailyMix(rows){
  var ids={}; rows.forEach(function(x){ ids[x[I.cid]]=1; });
  var a=$('d1').value, b=$('d2').value, idx=[], i;
  for(i=0;i<PD.dates.length;i++){ var d=PD.dates[i];
    if(a&&d<a) continue; if(b&&d>b) continue; idx.push(i); }
  var msg={}, pts={}, tot={};
  for(i=0;i<PD.rows.length;i++){ var r=PD.rows[i];
    tot[r[0]]=(tot[r[0]]||0)+r[3];
    if(ids[r[1]]){ msg[r[0]]=(msg[r[0]]||0)+r[2]; pts[r[0]]=(pts[r[0]]||0)+r[3]; } }
  var L=[],A=[],B=[];
  idx.forEach(function(i){
    var rv=(PD.rev[i]||0)/PD.fx, tp=tot[i]||0;
    L.push(PD.dates[i]); A.push(msg[i]||0);
    B.push((tp&&rv)? rv*(pts[i]||0)/tp : 0); });
  return {L:L,A:A,B:B};
}

/* 每日累計：依 dateField 累加（角色數/創作者數、成人/一般） */
function cumSeries(rows){
  var df=dateField(), byd={};
  rows.forEach(function(x){ var d=x[df]; if(!d) return;
    var o=byd[d]||(byd[d]={n:0,ad:0,au:{}});
    o.n++; if(x[I.adu]) o.ad++; o.au[x[I.aid]]=1; });
  var L=Object.keys(byd).sort(), seenAu={}, cn=0, ca=0, au=0;
  var CH=[],AU=[],AD=[],SF=[];            // 累計
  var dCH=[],dAU=[],dAD=[],dSF=[];        // 每日（新增）
  L.forEach(function(d){ var o=byd[d], newAu=0;
    for(var k in o.au){ if(!seenAu[k]){ seenAu[k]=1; newAu++; } }
    cn+=o.n; ca+=o.ad; au+=newAu;
    CH.push(cn); AU.push(au); AD.push(ca); SF.push(cn-ca);
    dCH.push(o.n); dAU.push(newAu); dAD.push(o.ad); dSF.push(o.n-o.ad); });
  return {L:L, CH:CH, AU:AU, AD:AD, SF:SF, dCH:dCH, dAU:dAU, dAD:dAD, dSF:dSF};
}

function renderAuthors(rows){

// ⚠ 一律以 DFULL（最後一個完整日）為基準，不用 DMAX。
//    DMAX 那天通常只有幾小時（來源時間戳換台北後跨日），拿它當「最新一天」會看到殘缺數字。
function quick(tag){
  var E=BASE();
  if(tag==='all') return setRange('','', 'all');
  if(tag==='y')   return setRange(E, E, 'y');
  if(tag==='p')   return setRange(shift(E,-1), shift(E,-1), 'p');
  if(tag==='7')   return setRange(shift(E,-6), E, '7');
  if(tag==='30')  return setRange(shift(E,-29), E, '30');
  if(tag==='m')   return setRange(E.slice(0,7)+'-01', E, 'm');
}
// 期間模式的基準是角色日資料最後一天（PD.d1），cohort 模式是最後一個完整建立日
function BASE(){ return isPeriod() ? (PD.d1||DFULL) : DFULL; }

function covLine(){
  if(!isPeriod()) return '';
  var g=periodAgg($('d1').value,$('d2').value);
  if(!g.revTot) return '';
  var line='<br>'+tf('cov_p', $('d1').value||PD.d0, $('d2').value||PD.d1,
      nf(Math.round(g.revTot)), nf(Math.round(g.revAtt)), pct(g.revAtt,g.revTot));
  // 暫估日提示：選取範圍碰到彙總表還沒出帳的日子才顯示
  var ed=(PD.est_days||[]), a=$('d1').value, b=$('d2').value;
  var hit=ed.filter(function(d){ return (!a||d>=a) && (!b||d<=b); });
  if(hit.length) line += '<br><span style="color:#fca5a5">'+tf('est_p', hit.join('、'))+'</span>';
  return line;
}

    : (t('info')+'<br>'+tf('base_dmax',DFULL,ASOF)+' —— '
       +(META.lag>0? tf('lag_yes',META.lag) : t('lag_no')));
  $('qy').textContent=t('q_latest')+' '+BASE().slice(5);
  $('qp').textContent=t('q_prev')+' '+shift(BASE(),-1).slice(5);
  $('hintChars').textContent=tf('hint_chars',nf(NLIVE));
  $('noteDates').innerHTML=tf('note_dates',nf(NLIVE),nf(NOPUB));
  $('noteNat').innerHTML=t('note_nat')+t('note_rev');
  var w=$('warnNat'); if(w) w.innerHTML=tf('warn_nat',w.dataset.n);
  document.querySelectorAll('.langseg button').forEach(function(b){b.classList.toggle('on',b.dataset.l===LANG)});
  draw();
}
document.querySelectorAll('.langseg button').forEach(function(b){
  b.onclick=function(){ LANG=b.dataset.l; localStorage.setItem('charLang',LANG); applyLang(); };});

['q','fnat','fadu','fvis','dfield','d1','d2'].forEach(function(id){
  $(id).addEventListener(id==='q'?'input':'change',function(){
    if(id==='d1'||id==='d2'){qbActive='';document.querySelectorAll('button.qb').forEach(function(x){x.classList.remove('on')});}
    draw();});});
['csort','clim'].forEach(function(id){$(id).addEventListener('change',function(){renderChars(filtered())})});
['asort','alim'].forEach(function(id){$(id).addEventListener('change',function(){renderAuthors(filtered())})});
document.querySelectorAll('button.qb').forEach(function(b){b.onclick=function(){quick(b.dataset.q)}});
setRange('','', 'all');
applyLang();
</script></body></html>
