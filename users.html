*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Noto Sans TC","Noto Sans KR",sans-serif;

:root{--bg2:#0e0e14;--bd:#21212c;--mut:#8d87a3;--tl:#14b8a6;--tl2:#0891b2;

h1{font-size:21px;font-weight:800;letter-spacing:-.3px}

.rfbtn{background:var(--bg2);border:1px solid var(--bd);color:var(--mut);font-weight:700;font-size:12.5px;padding:7px 13px;border-radius:9px;cursor:pointer;font-family:inherit}
.rfbtn:hover{color:#f3f1f8}
.ctrls{display:flex;gap:8px;align-items:center;margin-left:auto;flex-wrap:wrap}
.sub{color:var(--mut);font-size:13px}
.lang{margin-left:auto;display:flex;gap:3px;background:var(--bg2);border:1px solid var(--bd);border-radius:10px;padding:3px}
.lang button{border:0;background:transparent;color:var(--mut);font-weight:700;font-size:12.5px;padding:6px 13px;border-radius:8px;cursor:pointer;font-family:inherit}
.lang button.on{background:var(--grad);color:#fff}
.priv{background:#f43f5e18;border:1px solid #f43f5e44;color:#fda4af;border-radius:9px;padding:8px 13px;font-size:12px;margin:12px 0 18px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px}

.cl{color:var(--mut);font-size:12.5px;margin-bottom:5px}
.cv{font-size:23px;font-weight:800;letter-spacing:-.5px}
.cu{color:var(--mut);font-size:11.5px;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#141420;color:var(--mut);font-weight:700;font-size:12px;text-align:left;padding:9px 10px;white-space:nowrap;position:sticky;top:0;z-index:2}
td{padding:8px 10px;border-top:1px solid var(--bd);white-space:nowrap}
tbody tr:hover{background:#12121b}
.wrap{border:1px solid var(--bd);border-radius:13px;overflow:auto;max-height:640px}
.r{text-align:right}
.bar{height:7px;border-radius:4px;background:#ffffff12;overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;border-radius:4px}
.pill{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11.5px;font-weight:700}
.note{color:var(--mut);font-size:12px;margin-top:9px;line-height:1.65}

th.srt:hover{color:#f3f1f8}
.mono{font-variant-numeric:tabular-nums}

h2,.sh h2{font-size:20px}   /* Overview(v2) 的區塊標題是 .sh h2，權重比裸 h2 高 */
table th{font-size:13px}
table td{font-size:15px}

.cl{font-size:14px} .cv{font-size:28px} .cu{font-size:14px} .cs{font-size:13.5px}

.kpi .lab{font-size:14px} .kpi .val{font-size:28px} .kpi .sub{font-size:13.5px}
.by{font-size:13.5px} .foot{font-size:12px} .ttl{font-size:14.5px}

.kpi .v{font-size:28px} .kpi .l{font-size:14px} .kpi .s{font-size:12.5px}

.ctl .lbl{font-size:13.5px} .ctl input,.ctl select,.ctl button.qb{font-size:14px}

.note,.cap,.hint,small,.pill{font-size:12px}

/* ── 核心指標：一行四張、共兩行（Andy 指定）────────────────── */
/* #kpi_core 是 Overview(v2) 的 8 張卡；.kpis 是 Character 的 8 張卡 */
@media(min-width:1000px){
  #kpi_core.kgrid{grid-template-columns:repeat(4,1fr)}

}

var PER='all', SORT=3, DESC=true;
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function perSpend(u){return PER==='7'?u[7]:(PER==='30'?u[8]:u[3]);}
function perMsg(u){return PER==='7'?u[10]:(PER==='30'?u[11]:u[9]);}

function chanPill(c){
 var m={'web':['ch_web','#38bdf8'],'app':['ch_app','#f59e0b'],'app,web':['ch_both','#a78bfa']};
 var v=m[c]||m['web'];
 return '<span class="pill" style="background:'+v[1]+'22;color:'+v[1]+'">'+t(v[0])+'</span>';}

/* 06 App 付費用戶：main＝App 佔比>50%（含只用 App）／only＝只在 App 付過／any＝有在 App 付過。
   ⚠ u[3]=累計消費(含App)、u[19]=其中 App 的金額、u[18]=付費管道(web/app/'app,web')。
   佔比用 u[19]/u[3]，不用管道欄位——管道只說「有沒有」，說不出「主不主要」。 */
var APPMODE='main';
function appRows(){
 return D.U.filter(function(u){
   var sp=+u[3]||0, ap=+u[19]||0;
   if(APPMODE==='only') return u[18]==='app' && ap>0;
   if(APPMODE==='any')  return ap>0;
   return sp>0 && ap/sp>0.5;                 // main：App 佔比超過一半
 }).sort(function(a,b){return (+b[19]||0)-(+a[19]||0);});   // 依 App 消費排序
}
function appTable(){
 var rows=appRows();
 document.querySelectorAll('#appseg button').forEach(function(b){
   b.classList.toggle('on', b.dataset.a===APPMODE);});
 var totAll=0, totApp=0;
 rows.forEach(function(u){ totAll+=(+u[3]||0); totApp+=(+u[19]||0); });
 document.getElementById('appcnt').textContent =
   t('a_cnt').replace('%1', n(rows.length)).replace('%2', money(totApp))
     .replace('%3', totAll? (totApp/totAll*100).toFixed(0)+'%' : '—');
 var h='<tr><th>#</th><th>'+t('c_nick')+'</th><th>'+t('c_email')+'</th><th>'+t('c_chan')+'</th>'+
  '<th class="r">'+t('c_spend')+'</th><th class="r">'+t('a_appspend')+'</th><th class="r">'+t('a_apppct')+'</th>'+
  '<th class="r">'+t('c_orders')+'</th><th>'+t('c_lastp')+'</th><th>'+t('c_state')+'</th>'+
  '<th class="r">'+t('c_ptbal')+'</th><th>'+t('c_top')+'</th></tr>';
 if(!rows.length){
   h+='<tr><td colspan="12" style="color:var(--mut);padding:14px 6px">'+t('a_none')+'</td></tr>';}
 rows.slice(0,200).forEach(function(u,i){
  var st=stateOf(u[6]), sp=+u[3]||0, ap=+u[19]||0, pct=sp? ap/sp*100 : 0;
  h+='<tr><td class="mono">'+(i+1)+'</td><td>'+esc(u[0])+'</td>'+
   '<td class="mono" style="font-size:12px">'+esc(u[1])+'</td>'+
   '<td>'+chanPill(u[18])+'</td>'+
   '<td class="r mono">'+money(sp)+'</td>'+
   '<td class="r mono" style="color:#f59e0b">'+money(ap)+'</td>'+
   '<td class="r mono">'+pct.toFixed(0)+'%</td>'+
   '<td class="r mono">'+u[4]+'</td><td class="mono">'+u[5]+'</td>'+
   '<td><span class="pill" style="background:'+STC[st]+'22;color:'+STC[st]+'">'+stateName(st)+'</span></td>'+
   '<td class="r mono"'+(u[20]?' style="color:#7fb3ff"':' style="color:var(--mut)"')+'>'+n(u[20]||0)+'</td>'+
   '<td>'+esc(u[14])+(u[16]?' <span class="sub">('+u[16]+'%)</span>':'')+'</td></tr>';});
 document.getElementById('appTbl').innerHTML=h;
}

function userTable(){
 var q=(document.getElementById('q').value||'').toLowerCase().trim();
 var ft=document.getElementById('fTier').value, fs=document.getElementById('fState').value;
 var rows=D.U.filter(function(u){
  if(ft&&u[17]!==ft) return false;
  if(fs&&stateOf(u[6])!==fs) return false;
  if(q&&!((u[1]||'').toLowerCase().indexOf(q)>=0||(u[0]||'').toLowerCase().indexOf(q)>=0
        ||(u[14]||'').toLowerCase().indexOf(q)>=0)) return false;
  return true;});
 var key=[function(u){return u[0];},function(u){return u[1];},function(u){return u[2];},
   function(u){return u[3];},function(u){return u[4];},function(u){return u[6];},
   function(u){return perSpend(u);},function(u){return perMsg(u);},
   function(u){return u[12];},function(u){return u[16];},
   function(u){return u[18];}][SORT]||function(u){return u[3];};
 rows.sort(function(a,b){var x=key(a),y=key(b);
   if(typeof x==='string'){return DESC?String(y).localeCompare(String(x)):String(x).localeCompare(String(y));}
   return DESC?(y-x):(x-y);});
 document.getElementById('cnt').textContent=t('showing').replace('%s',n(rows.length));
 var hd=[['c_nick',0],['c_email',1],['c_chan',10],['c_regd',2],['c_spend',3],['c_orders',4],['c_dsp',5],
         ['c_pspend',6],['c_pmsg',7],['c_chars',8],['c_pct',9]];
 var h='<tr>'+hd.map(function(x,i){
   var r=(i>=3)?' class="srt r" ':' class="srt" ';
   return '<th'+r+'data-s="'+x[1]+'">'+t(x[0])+(SORT===x[1]?(DESC?' ▼':' ▲'):'')+'</th>';}).join('')
   +'<th>'+t('c_state')+'</th><th>'+t('c_top')+'</th></tr>';
 rows.slice(0,400).forEach(function(u){
  var st=stateOf(u[6]);
  h+='<tr><td>'+esc(u[0])+'</td><td class="mono" style="font-size:12px">'+esc(u[1])+'</td>'+
   '<td>'+chanPill(u[18])+'</td>'+
   '<td class="mono">'+u[2]+'</td><td class="r mono">'+money(u[3])+'</td>'+
   '<td class="r mono">'+u[4]+'</td><td class="r mono">'+u[6]+'</td>'+
   '<td class="r mono"'+(perSpend(u)?'':' style="color:var(--mut)"')+'>'+money(perSpend(u))+'</td>'+
   '<td class="r mono">'+n(perMsg(u))+'</td><td class="r mono">'+u[12]+'</td>'+
   '<td class="r mono">'+(u[16]?u[16]+'%':'—')+'</td>'+
   '<td><span class="pill" style="background:'+STC[st]+'22;color:'+STC[st]+'">'+stateName(st)+'</span></td>'+
   '<td>'+esc(u[14])+(u[15]?' <span class="sub">· '+esc(u[15])+'</span>':'')+'</td></tr>';});
 var tb=document.getElementById('uTbl'); tb.innerHTML=h;
 tb.querySelectorAll('th.srt').forEach(function(th){th.onclick=function(){
   var s=+th.dataset.s; if(SORT===s){DESC=!DESC;}else{SORT=s;DESC=true;} userTable();};});
}

function fillSelects(){
 var ft=document.getElementById('fTier'), fs=document.getElementById('fState');
 var tv=ft.value, sv=fs.value;
 ft.innerHTML='<option value="">'+t('f_all')+'</option>'+
   D.TM.filter(function(m){return ['whale','heavy','mid','light','trial'].indexOf(m[0])>=0;})
       .map(function(m){return '<option value="'+m[0]+'">'+m[1+L]+'</option>';}).join('');
 fs.innerHTML='<option value="">'+t('f_allst')+'</option>'+
   ['act','slow','sleep','lost'].map(function(s){return '<option value="'+s+'">'+stateName(s)+'</option>';}).join('');
 ft.value=tv; fs.value=sv;
}

function applyLang(){
 document.querySelectorAll('[data-i]').forEach(function(e){e.innerHTML=t(e.dataset.i);});
 document.querySelectorAll('[data-ip]').forEach(function(e){e.placeholder=t(e.dataset.ip);});
 document.documentElement.lang=['zh-Hant','en','ko'][L];
 fillSelects(); kpiCards(); tierTable(); bandTable(); topTable(); userTable(); appTable();
 document.querySelectorAll('#appseg button').forEach(function(b){
   b.onclick=function(){APPMODE=b.dataset.a; appTable();};});
}

/* ── 頂部固定列的重新整理鈕 ── */
/* ⚠ 不要幫 th 加 top 偏移。表格外層 .wrap 有 overflow:auto，表頭的 sticky 是相對
     那個容器、不是相對視窗，所以永遠碰不到頁面頂部的固定列。2026-09-16 曾加過
     --topH 偏移，結果表頭往容器內下移 116px，浮在資料列中間。 */
(function(){
 var rb=document.getElementById('btnRefresh');
 if(rb) rb.onclick=function(){ location.href=location.pathname+'?t='+Date.now(); };
})();
document.querySelectorAll('#langseg button').forEach(function(b){b.onclick=function(){
 L=+b.dataset.l; localStorage.setItem('usersLang',L);
 document.querySelectorAll('#langseg button').forEach(function(x){x.classList.toggle('on',x===b);});
 applyLang();};});
document.querySelectorAll('#perseg button').forEach(function(b){b.onclick=function(){
 PER=b.dataset.p;
 document.querySelectorAll('#perseg button').forEach(function(x){x.classList.toggle('on',x===b);});
 topTable(); userTable(); appTable();};});
document.getElementById('q').oninput=userTable;
document.getElementById('fTier').onchange=userTable;
document.getElementById('fState').onchange=userTable;
document.querySelectorAll('#langseg button').forEach(function(x){x.classList.toggle('on',+x.dataset.l===L);});
applyLang();
</script>
</body></html>
